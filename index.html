<!DOCTYPE html>
<html lang="ru" data-persona="jarvis">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MARK II — STARK OS</title>
<meta name="description" content="MARK II — персональный ИИ в стиле лаборатории Тони Старка: JARVIS, FRIDAY, ULTRON, VISION.">
<meta name="theme-color" content="#03060c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<canvas id="bg"></canvas>
<div class="aurora a1"></div><div class="aurora a2"></div><div class="aurora a3"></div>
<div class="vignette"></div>

<div id="boot">
  <div class="boot-box">
    <div class="boot-orb"></div>
    <div class="boot-brand">STARK INDUSTRIES</div>
    <div class="boot-name">MARK II</div>
    <div class="boot-track"><div id="bootBar"></div></div>
    <div id="bootLog"></div>
    <div class="boot-hint">нажми, чтобы пропустить</div>
  </div>
</div>

<header>
  <div class="logo">
    <div class="logo-mark"></div>
    <div class="logo-t"><b>MARK II</b><span>STARK OS · v17</span></div>
  </div>
  <div id="personaPills"></div>
  <div class="hdr-spacer"></div>
  <div class="net"><span class="net-dot" id="netDot"></span><span id="netTxt">…</span></div>
  <div id="clock">--:--:--</div>
  <button class="icon-btn" id="btnPalette" title="Палитра команд (Ctrl+K)">⌘</button>
  <button class="icon-btn" id="btnDiag" title="Диагностика">🔍</button>
  <button class="icon-btn" id="btnHelp" title="Помощь">?</button>
  <button class="icon-btn" id="btnSettings" title="Настройки">⚙</button>
  <button class="icon-btn" id="btnFull" title="Полный экран">⛶</button>
</header>

<main>
  <aside class="panel" id="left">
    <div class="p-title">ARC РЕАКТОР</div>
    <div class="reactor-box">
      <canvas id="reactor"></canvas>
      <div id="reactorName">JARVIS</div>
      <div id="reactorTitle"></div>
    </div>
    <div class="vu"><div id="vuFill"></div></div>
    <div class="stat-row"><span class="k">МИКРОФОН</span><span class="val" id="micState">○ выкл</span></div>
    <div class="stat-row"><span class="k">ЗРЕНИЕ</span><span class="val" id="visionState">—</span></div>
    <div class="toggles">
      <button class="tgl" id="tglWake" title="Реакция на имя">WAKE</button>
      <button class="tgl" id="tglVoice" title="Авто-озвучка ответов">VOICE</button>
      <button class="tgl" id="tglSfx" title="Звуки интерфейса">SFX</button>
    </div>
  </aside>

  <section class="panel" id="center">
    <div id="chat"></div>
    <div id="chips"></div>
    <form id="composer">
      <button type="button" class="icon-btn" id="btnArt" title="Творец — нарисовать">🎨</button>
      <button type="button" class="icon-btn" id="btnCam" title="Камера">📷</button>
      <textarea id="input" rows="1" placeholder="Спроси что-нибудь… или /help" autocomplete="off"></textarea>
      <button type="button" class="icon-btn" id="btnMic" title="Микрофон">🎙</button>
      <button type="button" class="icon-btn" id="btnStop" title="Стоп">⏹</button>
      <button type="submit" class="icon-btn on" id="btnSend" title="Отправить">➤</button>
    </form>
    <div id="interim"></div>
  </section>

  <aside id="right">
    <div class="panel mod">
      <div class="p-title">ТЕЛЕМЕТРИЯ · ДУШАНБЕ</div>
      <div class="widget" id="wWeather">🌤 …</div>
      <div class="widget" id="wRates">💱 …</div>
    </div>
    <div class="panel mod">
      <div class="p-title">ЗАДАЧИ</div>
      <div id="todoList"></div>
    </div>
    <div class="panel mod">
      <div class="p-title">НАПОМИНАНИЯ</div>
      <div id="remList"></div>
    </div>
    <div class="panel mod">
      <div class="p-title">ГАЛЕРЕЯ</div>
      <div id="galStrip"></div>
    </div>
  </aside>
</main>

<div id="camPanel" hidden>
  <video id="camVideo" playsinline muted></video>
  <div class="cam-bar">
    <span id="camState">—</span>
    <button class="icon-btn" id="camFlip" title="Фронт ↔ Зад" style="width:32px;height:32px">⇄</button>
    <button class="icon-btn" id="camClose" title="Закрыть" style="width:32px;height:32px">✕</button>
  </div>
  <label class="cam-ai"><input type="checkbox" id="camAI" checked> ИИ-зрение: жесты ✋✊ + лицо</label>
</div>

<div id="toasts"></div>

<div id="palette" hidden>
  <div class="panel pal-box">
    <input id="palInput" placeholder="Введи команду…" autocomplete="off">
    <div id="palList"></div>
  </div>
</div>

<div id="modalRoot"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
